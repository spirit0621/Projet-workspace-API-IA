services:
  google-workspace-hub:
    build: .
    container_name: google-workspace-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Montage des dossiers de configuration et données
      - ./.env:/app/.env:ro
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
